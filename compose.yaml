name: arr-lifecycle
services:
  app:
    build: .
    image: arr-lifecycle:local
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - .env.local
    environment:
      RADARR_URL: http://radarr:7878
      SONARR_URL: http://sonarr:8989
      SONARR_ANIME_URL: http://sonarr-anime:8989
      FS_INSPECTION_ENABLED: "true"
      NAS_INSPECTION_ENABLED: "true"
      MOVIE_DELETION_ENABLED: "true"
      SERIES_DELETION_ENABLED: "true"
      APP_ORIGIN: http://192.168.1.161:3210
      DELETE_STATE_DIR: /app-state
    ports:
      - "192.168.1.161:3210:3000"
    networks:
      - arr
    volumes:
      - type: bind
        source: ./state
        target: /app-state
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/nas_key
        target: /run/secrets/nas_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/nas_known_hosts
        target: /run/secrets/nas_known_hosts
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/truenas-share/server/arr/data/media
        target: /data/media
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/truenas-share/server/arr/data/torrents
        target: /data/torrents
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  arr:
    external: true
    name: arr_default
